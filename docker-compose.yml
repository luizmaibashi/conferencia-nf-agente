services:
  api:
    build: .
    environment:
      - GEMINI_API_KEY
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - DADOS_DIR=/app/data
      - TZ=America/Sao_Paulo
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.3
    environment:
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_dados:/home/node/.n8n
      - ./n8n:/workflows:ro
    ports:
      - "5678:5678"
    depends_on:
      - api

volumes:
  n8n_dados:
